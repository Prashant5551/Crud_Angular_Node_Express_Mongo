<div class="container mt-5">
  <h1 class="text-center">Student List</h1>
  <div class="d-flex justify-content-end mb-1">
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#myModal">Add Student</button>
  </div>
  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>Sr No</th>
        <th>Student Name</th>
        <th>Age</th>
        <th>Email</th>
        <th>Class</th>
        <th>Address</th>
        <th>Phone</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Sr No</td>
        <td>Student Name</td>
        <td>Age</td>
        <td>Email</td>
        <td>Class</td>
        <td>Address</td>
        <td>Phone</td>
        <td class="d-flex justify-content-end">
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">Edit</button>
          <button class="btn btn-danger ms-2">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- The Modal -->
<div class="modal" id="myModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">Add/Edit Student</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form [formGroup]="studentForm">
          <div class="row">
            <div class="col-md-6 border-end">
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" formControlName="name"
                  placeholder="Enter student name" />
                <div class="text-danger small">Name is required</div>
              </div>
              <div class="mb-3">
                <label for="name" class="form-label">Age</label>
                <input type="number" class="form-control" id="age" formControlName="age"
                  placeholder="Enter students age" />
                <div class="text-danger small">Valid Age is required</div>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" formControlName="email"
                  placeholder="Enter students email" />
                <div class="text-danger small">Email is required</div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="mb-3">
                <label for="studentClass" class="form-label">Class</label>
                <input type="text" class="form-control" id="studentClass" formControlName="studentClass"
                  placeholder="Enter students class" />
                <div class="text-danger small">Class is required</div>
              </div>
              <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" formControlName="address"
                  placeholder="Enter students address" />
                <div class="text-danger small">Address is required</div>
              </div>
              <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="tel" class="form-control" id="phone" formControlName="phone"
                  placeholder="Enter students phone" />
                <div class="text-danger small">phone is required</div>
              </div>
            </div>
          </div>
          <button type="submit" class="btn btn-danger" data-bs-dismiss="modal">close</button>
        </form>
      </div>
    </div>
  </div>
</div>
