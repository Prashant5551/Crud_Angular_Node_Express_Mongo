<div class="row">
    <div class="col-12 text-end">
        <button class="btn btn-primary" (click)="onAddNew()">Add New</button>
        <button class="btn btn-warning" (click)="onSaveAll()">Save All</button>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th> <input type="checkbox" (change)="SelectAll($event)"></th>
                    <th>Department Name</th>
                    <th>Department Logo</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                @for (item of deptList(); track $index) {
                <tr>
                    <td>
                        <!-- {{ $index +1 }} -->
                        <input type="checkbox" [checked]="getCheckedStatus(item.departmentId)"
                            (change)="addCheckedItem($event,item.departmentId)">
                    </td>
                    <td><input type="text" class="form-control" [(ngModel)]="item.departmentName" placeholder="Name">
                    </td>
                    <td><input type="text" class="form-control" [(ngModel)]="item.departmentLogo" placeholder="Logo">
                    </td>
                    <td>{{ item | json}}</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
