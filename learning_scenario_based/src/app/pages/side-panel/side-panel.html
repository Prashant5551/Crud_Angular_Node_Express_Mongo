<div class="row">
    <div [ngClass]="isSidePanelOpen() ==true ? 'col-8' : 'col-12' ">
        <div class="card">
            <div class="card-header bg-warning">
                <div class="row">
                    <div class="col-6">
                        User List
                    </div>
                    <div class="col-6 text-end">
                        <button class="btn btn-success" (click)="openSidePanel()">Add new</button>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-12">
                        <table class="table table-table-bordered">
                            <thead>
                                <tr>
                                    <th>Sr No</th>
                                    <th>Name</th>
                                    <th>User Name</th>
                                    <th>Email</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <td>1</td>
                                    <td>2</td>
                                    <td>3</td>
                                    <td>4</td>
                                </tr>
                                <tr>
                                    <td>1</td>
                                    <td>2</td>
                                    <td>3</td>
                                    <td>4</td>
                                </tr>
                            </tbody>

                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    @if (isSidePanelOpen()) {
    <div class="col-4">
        <div class="card">
            <div class="card-header bg-warning">
                <div class="row">
                    <div class="col-6">
                        New User
                    </div>
                    <div class="col-6 text-end">
                        <button class="btn btn-secondary" (click)="closeSidePanel()">Close</button>
                        <button class="btn btn-success">Save</button>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-6">
                        <label for="">Name</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="col-6">
                        <label for="">User Name</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="col-6">
                        <label for="">Email</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="col-6">
                        <label for="">Password</label>
                        <input type="text" class="form-control">
                    </div>
                </div>
            </div>
        </div>
    </div>
    }
</div>

<hr />
<hr />

    @if (currentView() == 'List') {
    <div class="col-12">

                </div>
            </div>

                                    <th>Sr No</th>
                                    <th>Name</th>

                                    <th>Email</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <td>1</td>
                                    <td>2</td>
                                    <td>3</td>
                                    <td>4</td>
                                </tr>
                                <tr>
                                    <td>1</td>
                                    <td>2</td>
                                    <td>3</td>
                                    <td>4</td>
                                </tr>
                            </tbody>

                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    }
    @else {
    <div class="col-12">
        <div class="card">

                        <button class="btn btn-secondary" (click)="toggleView()">Close</button>

                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-6">
                        <label for="">Name</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="col-6">
                        <label for="">User Name</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="col-6">
                        <label for="">Email</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="col-6">
                        <label for="">Password</label>
                        <input type="text" class="form-control">
                    </div>
                </div>
            </div>
        </div>
    </div>
    }
</div>
